name: Build NanoPi M6V2 Vendor Patched

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nanopi-m6v2-noble-vendor-patched
  cancel-in-progress: false

jobs:
  build:
    name: Build NanoPi M6V2 Ubuntu 24.04 GNOME Vendor Patched
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Build patched Armbian vendor image
        uses: armbian/build@main
        with:
          armbian_token: ${{ secrets.GITHUB_TOKEN }}
          armbian_runner_clean: "yes"
          armbian_target: "build"

          # 使用包含 ES8389 配置的 Armbian 构建 PR
          armbian_branch: "refs/pull/10980/head"

          armbian_board: "friendlyelec-rk3588"
          armbian_release: "noble"

          # Rockchip BSP 6.1 内核
          armbian_kernel_branch: "vendor"

          # GNOME 桌面
          armbian_ui: "gnome"

          armbian_compress: "sha,img,xz"

          armbian_release_tag: "m6v2-noble-vendor-patched-${{ github.run_number }}"
          armbian_release_title: "NanoPi M6V2 Ubuntu 24.04 GNOME Vendor Patched"
