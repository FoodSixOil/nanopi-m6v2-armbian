name: Build Armbian 24.04 for NanoPi M6V2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nanopi-m6v2-noble-current
  cancel-in-progress: false

jobs:
  build:
    name: Build NanoPi M6V2 Ubuntu 24.04 GNOME Current
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Build Armbian image
        uses: armbian/build@main
        with:
          armbian_token: ${{ secrets.GITHUB_TOKEN }}
          armbian_runner_clean: "yes"
          armbian_target: "build"

          # 当前包含 NanoPi M6V2 支持的上游代码
          armbian_branch: "refs/pull/10946/head"

          # M6V2 使用统一的 FriendlyElec RK3588 镜像
          armbian_board: "friendlyelec-rk3588"

          # Ubuntu 24.04 LTS
          armbian_release: "noble"

          # Mainline/current 内核
          armbian_kernel_branch: "current"

          # GNOME 图形桌面
          armbian_ui: "gnome"

          # 输出镜像、xz 压缩包和校验文件
          armbian_compress: "sha,img,xz"

          # 编译完成后自动创建 GitHub Release
          armbian_release_tag: "m6v2-noble-current-${{ github.run_number }}"
          armbian_release_title: "NanoPi M6V2 Ubuntu 24.04 GNOME Current"
