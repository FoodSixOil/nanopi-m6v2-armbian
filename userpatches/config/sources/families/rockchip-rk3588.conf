if [[ "${BRANCH}" == vendor* ]]; then
	# 使用 FriendlyELEC 官方、经过 NanoPi6 系列实际使用的 6.1 内核
	declare -g KERNELSOURCE="https://github.com/friendlyarm/kernel-rockchip.git"
	declare -g KERNELBRANCH="branch:nanopi6-v6.1.y"
	declare -g KERNEL_MAJOR_MINOR="6.1"

	# 不应用只适用于 Armbian linux-rockchip 内核的补丁
	declare -g KERNELPATCHDIR="friendlyelec-nanopi6-vendor"

	# 使用工作流下载的 FriendlyELEC 官方内核配置
	declare -g LINUXCONFIG="linux-rk35xx-vendor"

	# NanoPi M6V2 对应 FriendlyELEC rev0c 设备树
	declare -g BOOT_FDT_FILE="rockchip/rk3588-nanopi6-rev0c.dtb"
	declare -g BOOT_FDT_FILE_FALLBACK="rockchip/rk3588-nanopi6-rev0c.dtb"

	# 官方配置已包含板载网络、音频等驱动，不加载 Armbian 额外 Wi-Fi 驱动
	declare -g EXTRAWIFI="no"
fi
